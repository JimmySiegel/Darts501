<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#3f5aa6;--op:#fff;--pc:#dce1ff;--opc:#00164f;--s:#faf8ff;--sc:#eeedf4;--sch:#e3e2e9;--os:#1b1b1f;--ov:#5a5b64;--ol:#b5b6c0;--ok:#1b6c3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#b4c5ff;--op:#0f2a75;--pc:#2b4287;--opc:#dce1ff;--s:#121318;--sc:#1e1f25;--sch:#292a2f;--os:#e3e1e9;--ov:#b5b6c0;--ol:#505159;--ok:#7bd89a}}
:root[data-theme="dark"]{--p:#b4c5ff;--op:#0f2a75;--pc:#2b4287;--opc:#dce1ff;--s:#121318;--sc:#1e1f25;--sch:#292a2f;--os:#e3e1e9;--ov:#b5b6c0;--ol:#505159;--ok:#7bd89a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--s);color:var(--os);font-family:"Roboto Flex",system-ui,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--s);display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 20px;max-width:560px;margin:0 auto}
h1{font-size:1.6rem;font-weight:500;margin:0}
main{max-width:560px;margin:0 auto;padding:4px 16px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
.ic{width:44px;height:44px;border-radius:50%;font-size:1.15rem;color:var(--ov)}
.fill,.tonal,.text{border-radius:20px;padding:10px 22px;font-weight:500}
.fill{background:var(--p);color:var(--op)}.tonal{background:var(--pc);color:var(--opc);width:100%;margin:8px 0}.text{color:var(--p);padding:10px 14px}
.card,.card2{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;text-align:left;background:var(--sc);border-radius:20px;padding:16px;margin:8px 0;color:var(--os)}
.card2{display:block}
.card b{font-size:1.1rem;font-weight:500}.card span,.sub{color:var(--ov);font-size:.85rem}
.sub{margin:2px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:.72rem;background:var(--pc);color:var(--opc);border-radius:8px;padding:3px 8px;white-space:nowrap}
.lab{color:var(--ov);font-size:.85rem;margin:14px 4px 4px}
input,select,textarea{background:transparent;border:1px solid var(--ol);border-radius:12px;padding:10px 12px;box-sizing:border-box;max-width:100%}
input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button{display:none}
.set{display:flex;align-items:center;gap:6px;margin:6px 0}
.set>span{width:16px;color:var(--ov);font-size:.85rem}
.st{display:flex;align-items:center;background:var(--sch);border-radius:20px}
.st button{width:34px;height:42px;font-size:1.25rem;color:var(--p)}
.st input{width:54px;border:0;text-align:center;background:none;padding:0;font-weight:500;font-size:1.05rem}
.st.r input{width:36px}
.ck{width:42px;height:42px;border-radius:50%;border:2px solid var(--ol);color:var(--ol);font-size:1.1rem;margin-left:auto}
.ck.on{background:var(--p);border-color:var(--p);color:var(--op)}
.lr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ol)}
.lr .ic{width:34px;height:34px;font-size:1rem}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sr{display:flex;align-items:center;gap:6px;margin:6px 0}.sr input{width:76px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card2{margin:0}.big{font-size:1.7rem;font-weight:500;color:var(--p)}
.empty{text-align:center;color:var(--ov);padding:60px 20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sc);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--ov)}
nav svg{width:24px;height:24px;fill:currentColor}
nav .pl{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
nav .on{color:var(--os);font-weight:500}nav .on .pl{background:var(--pc);color:var(--opc)}
dialog{border:0;border-radius:28px;background:var(--sch);color:var(--os);width:min(92vw,400px);padding:24px;box-sizing:border-box;max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px;font-weight:500;font-size:1.4rem}
dialog label{display:block;color:var(--ov);font-size:.85rem;margin:10px 0}
dialog label input,dialog label select,dialog textarea{display:block;width:100%;margin-top:4px;color:var(--os);font-size:1rem}
dialog textarea{height:90px;margin-top:8px}.chk{display:flex!important;align-items:center;gap:8px}.chk input{width:auto;margin:0}
.bar{display:flex;justify-content:space-between;margin-top:16px}
svg.ch{width:100%;height:auto;background:var(--sc);border-radius:20px;margin:6px 0}
svg.ch text{fill:var(--ov);font-size:9px;text-anchor:middle}svg.ch text.v{fill:var(--os);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.rc{white-space:nowrap;border:1px solid var(--ol);border-radius:10px;padding:8px 14px;color:var(--ov)}.rc.on{background:var(--pc);color:var(--opc);border-color:var(--pc);font-weight:500}
</style>
</head>
<body>
<header><h1 id="ti">Train</h1><div><button class="ic" onclick="flip()" aria-label="Toggle light or dark">◐</button><button class="ic" onclick="sett()" aria-label="Settings">⚙</button></div></header>
<main id="main"></main>
<nav>
<button data-t="train" onclick="go('train')"><div class="pl"><svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg></div>Train</button>
<button data-t="routine" onclick="go('routine')"><div class="pl"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></div>Routine</button>
<button data-t="hist" onclick="go('hist')"><div class="pl"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></div>History</button>
<button data-t="stats" onclick="go('stats')"><div class="pl"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></div>Stats</button>
</nav>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TY={plate:'Plate loaded',machine:'Machine',db:'Dumbbell',other:'Other'};
const iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),dt=d=>new Date(d+'T00:00');
const fd=d=>dt(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const ss=s=>s.map(x=>x.w+'×'+x.r).join(' · ');
let D=load(),V={tab:'train',lift:'',date:today()},T,LD;
function BASE(){return{theme:'',bar:45,plates:[45,35,25,10,5,2.5],days:[],log:[],cur:null,routines:[],rid:''}}
function mig(d){d={...BASE(),...d};if(!d.routines.length){d.routines=[{id:'r1',name:'My routine'}];d.days.forEach(x=>x.rid='r1')}if(!d.routines.some(r=>r.id===d.rid))d.rid=d.routines[0].id;return d}
function load(){try{const d=JSON.parse(localStorage.getItem('liftlog1'));if(d&&d.days&&d.log)return mig(d)}catch(e){}return mig({})}
function save(){try{localStorage.setItem('liftlog1',JSON.stringify(D))}catch(e){}}
function theme(){const c=D.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=c;return c}
function flip(){D.theme=theme()==='dark'?'light':'dark';save();theme()}
const dg=h=>{const e=$('#dlg');e.innerHTML=h;if(!e.open)e.showModal()},cl=()=>$('#dlg').close();
const note=m=>dg(`<p>${m}</p><div class=acts><button class=text onclick=cl()>OK</button></div>`);
function sure(m,f){window._f=f;dg(`<p>${m}</p><div class=acts><button class=text onclick=cl()>Cancel</button><button class=fill onclick="cl();_f()">Yes</button></div>`)}
function ask(t,v,f){window._f=f;dg(`<h3>${t}</h3><input id=ai value="${esc(v)}" style="width:100%"><div class=acts><button class=text onclick=cl()>Cancel</button><button class=fill onclick="const v=$('#ai').value.trim();if(v){cl();_f(v)}">Save</button></div>`)}
function render(){theme();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));
$('#ti').textContent=V.tab==='train'?(D.cur?D.cur.day:'Train'):{routine:'Routine',hist:'History',stats:'Stats'}[V.tab];
$('#main').innerHTML=({train:vTrain,routine:vRoutine,hist:vHist,stats:vStats})[V.tab]()}
function go(t){V.tab=t;render();scrollTo(0,0)}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()};
const dflt=()=>({name:'',type:'plate',save:1,sets:[{w:45,r:8},{w:45,r:8},{w:45,r:8}]});

/* TRAIN */
function vTrain(){if(D.cur)return vWork();
const ds=D.days.filter(d=>d.rid===D.rid),rb=D.routines.length>1?rbar(0):'';if(!ds.length)return rb+`<div class=empty>No days in this routine yet. Add them in the Routine tab.</div>`;
return rb+`<div class=lab>Workout date</div><input type=date value="${V.date}" onchange="V.date=this.value||today()"><div class=lab>Choose a day</div>`+ds.map(d=>`<button class=card onclick="start('${d.id}')"><b>${esc(d.name)}</b><span>${d.lifts.length} lifts</span></button>`).join('')}
function start(id){const d=D.days.find(x=>x.id===id);D.cur={mode:'new',dayId:id,day:d.name,date:V.date,lifts:d.lifts.map(l=>({pid:l.id,name:l.name,type:l.type,sets:l.sets.map(s=>({w:s.w,r:s.r,d:0}))}))};save();render()}
function lastOf(n){const e=[...D.log].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>e.entries.find(x=>x.name===n)).find(Boolean);return e?ss(e.sets):''}
function plates(w){const b=D.bar;if(!w)return'';if(w<=b)return'Just the bar ('+b+' lb)';let r=(w-b)/2,o=[];for(const p of D.plates)while(r>=p-1e-9){o.push(p);r-=p}return'Per side: '+(o.join(' + ')||'none')+(r>.01?' (+'+r+' left)':'')}
function vWork(){const W=D.cur,ed=W.mode==='edit';
return`<div class=row><span class=sub>${ed?'Editing workout':''}</span><input type=date value="${W.date}" onchange="D.cur.date=this.value||today();save()"></div>`+W.lifts.map(card).join('')+
`<button class=tonal onclick="addL()">+ Add lift</button><div class=bar><button class=text onclick="drop()">${ed?'Delete workout':'Discard'}</button><button class=fill onclick="fin()">${ed?'Save changes':'Finish workout'}</button></div>`}
function card(l,i){const W=D.cur,last=W.mode==='new'?lastOf(l.name):'',mx=Math.max(0,...l.sets.map(s=>+s.w||0));
return`<div class=card2><div class=row><b>${esc(l.name)}</b><span class=chip>${TY[l.type]}</span></div>
<div class=sub>${W.mode==='new'&&last?'Last: '+last:''}${l.type==='db'?' · per dumbbell':''}</div>
${l.type==='plate'?`<div class=sub>${plates(mx)}</div>`:''}
${l.sets.map((s,j)=>`<div class=set><span>${j+1}</span><div class=st><button onclick="adj(${i},${j},'w',-5)">−</button><input type=number inputmode=decimal value="${s.w}" onchange="put(${i},${j},'w',this.value)"><button onclick="adj(${i},${j},'w',5)">+</button></div><div class="st r"><button onclick="adj(${i},${j},'r',-1)">−</button><input type=number inputmode=numeric value="${s.r}" onchange="put(${i},${j},'r',this.value)"><button onclick="adj(${i},${j},'r',1)">+</button></div><button class="ck ${s.d?'on':''}" onclick="tog(${i},${j})" aria-label="Set done">✓</button></div>`).join('')}
<div class=row><button class=text onclick="addS(${i})">+ Set</button><button class=text onclick="delS(${i})">− Set</button></div></div>`}
const S=(i,j)=>D.cur.lifts[i].sets[j];
function adj(i,j,f,v){const s=S(i,j);s[f]=Math.max(0,(+s[f]||0)+v);save();render()}
function put(i,j,f,v){S(i,j)[f]=Math.max(0,+v||0);save();render()}
function tog(i,j){const s=S(i,j);s.d=s.d?0:1;save();render()}
function addS(i){const a=D.cur.lifts[i].sets,l=a[a.length-1]||{w:0,r:8};a.push({w:l.w,r:l.r,d:0});save();render()}
function delS(i){D.cur.lifts[i].sets.pop();save();render()}
function addL(){T=dflt();LD={title:'Add lift',sv:D.cur.mode==='new',cb:t=>{D.cur.lifts.push({pid:null,name:t.name.trim(),type:t.type,save:t.save,sets:t.sets.map(s=>({...s,d:0}))});save();render()}};ld()}
function drop(){const ed=D.cur.mode==='edit';sure(ed?'Delete this workout from your history?':'Discard this workout?',()=>{if(ed)D.log=D.log.filter(x=>x.id!==D.cur.id);D.cur=null;save();go(ed?'hist':'train')})}
function fin(){const W=D.cur,pick=l=>l.sets.filter(x=>x.d).map(x=>({w:+x.w||0,r:+x.r||0})),en=[];
W.lifts.forEach(l=>{const s=pick(l);if(s.length)en.push({name:l.name,type:l.type,sets:s})});
if(!en.length)return note('Check off at least one set before finishing.');
if(W.mode==='edit'){Object.assign(D.log.find(x=>x.id===W.id),{date:W.date,entries:en})}
else{D.log.push({id:uid(),date:W.date,day:W.day,entries:en});const d=D.days.find(x=>x.id===W.dayId);
if(d)W.lifts.forEach(l=>{const s=pick(l);if(!s.length)return;const p=l.pid&&d.lifts.find(x=>x.id===l.pid);if(p)p.sets=s;else if(l.save)d.lifts.push({id:uid(),name:l.name,type:l.type,sets:s})})}
D.cur=null;V.date=today();save();go('hist')}

/* LIFT DIALOG */
function ld(){dg(`<h3>${LD.title}</h3><label>Name<input id=ln value="${esc(T.name)}"></label><label>Type<select id=lt onchange="sy();ld()">${Object.entries(TY).map(([k,v])=>`<option value=${k} ${T.type===k?'selected':''}>${v}</option>`).join('')}</select></label>
<div class=lab>Sets: weight${T.type==='db'?' (each)':''} × reps</div>${T.sets.map((s,i)=>`<div class=sr><input type=number inputmode=decimal id=w${i} value="${s.w}"> × <input type=number inputmode=numeric id=r${i} value="${s.r}"><button class=ic onclick="sy();T.sets.splice(${i},1);ld()">✕</button></div>`).join('')}
<button class=text onclick="sy();T.sets.push({...(T.sets[T.sets.length-1]||{w:0,r:8})});ld()">+ Set</button>
${LD.sv?`<label class=chk><input type=checkbox id=sv ${T.save?'checked':''}> Save to my routine</label>`:''}
<div class=acts><button class=text onclick=cl()>Cancel</button><button class=fill onclick="lsave()">Save</button></div>`)}
function sy(){T.name=$('#ln').value;T.type=$('#lt').value;T.sets.forEach((s,i)=>{s.w=+$('#w'+i).value||0;s.r=+$('#r'+i).value||0});const c=$('#sv');if(c)T.save=c.checked?1:0}
function lsave(){sy();if(!T.name.trim())return;if(!T.sets.length)T.sets=[{w:0,r:8}];cl();LD.cb(T)}

/* ROUTINE */
function vRoutine(){const n=D.days.filter(d=>d.rid===D.rid).length;return rbar(1)+(n?'':`<div class=empty>Add your first workout day, like Push or Legs.</div>`)+D.days.map((d,i)=>d.rid!==D.rid?'':`<div class=card2><div class=row><b>${esc(d.name)}</b><span><button class=ic onclick="renD(${i})">✎</button><button class=ic onclick="mvD(${i},-1)">↑</button><button class=ic onclick="mvD(${i},1)">↓</button><button class=ic onclick="delD(${i})">✕</button></span></div>`+
d.lifts.map((l,j)=>`<div class=lr><div><div>${esc(l.name)} <span class=chip>${TY[l.type]}</span></div><div class=sub>${ss(l.sets)}</div></div><span style="white-space:nowrap"><button class=ic onclick="mv(D.days[${i}].lifts,${j},-1)">↑</button><button class=ic onclick="mv(D.days[${i}].lifts,${j},1)">↓</button><button class=ic onclick="edL(${i},${j})">✎</button><button class=ic onclick="delL(${i},${j})">✕</button></span></div>`).join('')+
`<button class=text onclick="addR(${i})">+ Add lift</button></div>`).join('')+`<button class=tonal onclick="addD()">+ Add workout day</button>`}
const addD=()=>ask('Name this day','',n=>{D.days.push({id:uid(),rid:D.rid,name:n,lifts:[]});save();render()});
function mvD(i,d){let j=i+d;while(j>=0&&j<D.days.length&&D.days[j].rid!==D.rid)j+=d;if(j<0||j>=D.days.length)return;[D.days[i],D.days[j]]=[D.days[j],D.days[i]];save();render()}
function rbar(ed){return`<div class=chips>${D.routines.map(r=>`<button class="rc ${r.id===D.rid?'on':''}" onclick="D.rid='${r.id}';save();render()">${esc(r.name)}</button>`).join('')}<button class=rc onclick="addRt()">+ New routine</button></div>`+(ed?`<div class=row><span></span><span><button class=text onclick="renRt()">Rename routine</button><button class=text onclick="delRt()">Delete routine</button></span></div>`:'')}
const addRt=()=>ask('Name this routine','',n=>{const id=uid();D.routines.push({id,name:n});D.rid=id;save();go('routine')});
const renRt=()=>ask('Rename routine',D.routines.find(r=>r.id===D.rid).name,n=>{D.routines.find(r=>r.id===D.rid).name=n;save();render()});
function delRt(){if(D.routines.length<2)return note('You need at least one routine.');sure('Delete this routine and its days? Past workouts stay in History.',()=>{D.days=D.days.filter(d=>d.rid!==D.rid);D.routines=D.routines.filter(r=>r.id!==D.rid);D.rid=D.routines[0].id;save();render()})}
const renD=i=>ask('Rename day',D.days[i].name,n=>{D.days[i].name=n;save();render()});
const delD=i=>sure('Delete '+esc(D.days[i].name)+' and its lifts? Past workouts stay in History.',()=>{D.days.splice(i,1);save();render()});
const delL=(i,j)=>sure('Remove this lift from the day?',()=>{D.days[i].lifts.splice(j,1);save();render()});
function addR(i){T=dflt();LD={title:'Add lift',cb:t=>{D.days[i].lifts.push({id:uid(),name:t.name.trim(),type:t.type,sets:t.sets});save();render()}};ld()}
function edL(i,j){const l=D.days[i].lifts[j];T=JSON.parse(JSON.stringify(l));LD={title:'Edit lift',cb:t=>{Object.assign(l,{name:t.name.trim(),type:t.type,sets:t.sets});save();render()}};ld()}

/* HISTORY */
const vol=e=>e.entries.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+s.w*s.r*(x.type==='db'?2:1),0),0);
function vHist(){if(!D.log.length)return`<div class=empty>Finished workouts show up here. To log a past one, pick its date on the Train tab.</div>`;
return[...D.log].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<button class=card onclick="edit('${e.id}')"><div><b>${fd(e.date)}</b><div class=sub>${esc(e.day)} · ${e.entries.length} lifts</div></div><span>${Math.round(vol(e)).toLocaleString()} lb</span></button>`).join('')}
function edit(id){const e=D.log.find(x=>x.id===id);D.cur={mode:'edit',id,day:e.day,date:e.date,lifts:e.entries.map(x=>({pid:null,name:x.name,type:x.type,sets:x.sets.map(s=>({...s,d:1}))}))};save();go('train')}

/* STATS */
const e1=(s,t)=>{const w=s.w*(t==='db'?2:1);return s.r<=1?w:w*(1+s.r/30)};
const wk=d=>{const t=dt(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return iso(t)};
function weeks(){const t=dt(wk(today())),a=[];for(let i=0;i<8;i++){a.unshift(iso(t));t.setDate(t.getDate()-7)}return a}
const k=n=>n>=1000?(n/1000).toFixed(1)+'k':Math.round(n);
function bars(v,l){const m=Math.max(1,...v),w=320/v.length;return`<svg class=ch viewBox="0 0 320 130">`+v.map((x,i)=>{const h=x/m*80;return`<rect x="${i*w+8}" y="${100-h}" width="${w-16}" height="${Math.max(h,1)}" rx="4" fill="var(--p)"/><text class=v x="${i*w+w/2}" y="${94-h}">${x?k(x):''}</text><text x="${i*w+w/2}" y="118">${l[i]}</text>`}).join('')+`</svg>`}
function line(p){if(!p.length)return'';const ys=p.map(x=>x[1]),a=Math.min(...ys),b=Math.max(...ys),r=b-a||1,n=p.length,st=Math.ceil(n/7),X=i=>n<2?160:24+i*272/(n-1),Y=y=>120-(y-a)/r*70;
return`<svg class=ch viewBox="0 0 320 160"><polyline fill="none" stroke="var(--p)" stroke-width="2.5" points="${p.map((x,i)=>X(i)+','+Y(x[1])).join(' ')}"/>`+p.map((x,i)=>{const sh=(i%st===0&&n-1-i>=st/2)||i===n-1;return`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.5" fill="var(--p)"/>`+(sh?`<text class=v x="${X(i)}" y="${Y(x[1])-9}">${Math.round(x[1])}</text><text x="${X(i)}" y="150">${+x[0].slice(5,7)+'/'+ +x[0].slice(8)}</text>`:'')}).join('')+`</svg>`}
function line0(p){if(!p.length)return'';const ys=p.map(x=>x[1]),a=Math.min(...ys),b=Math.max(...ys),r=b-a||1,n=p.length;const X=i=>n<2?160:20+i*280/(n-1),Y=y=>100-(y-a)/r*70;
return`<svg class=ch viewBox="0 0 320 130"><polyline fill="none" stroke="var(--p)" stroke-width="2.5" points="${p.map((x,i)=>X(i)+','+Y(x[1])).join(' ')}"/>`+p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.5" fill="var(--p)"/>`).join('')+`<text x="22" y="22">${Math.round(b)}</text><text x="22" y="118">${p[0][0].slice(5)}</text><text x="298" y="118">${p[n-1][0].slice(5)}</text></svg>`}
function vStats(){if(!D.log.length)return`<div class=empty>Log a workout to see your stats.</div>`;
const W=weeks(),c={},v={};D.log.forEach(e=>{const q=wk(e.date);c[q]=(c[q]||0)+1;v[q]=(v[q]||0)+vol(e)});
const lb=W.map(x=>+x.slice(5,7)+'/'+ +x.slice(8)),cv=W.map(x=>c[x]||0),vv=W.map(x=>v[x]||0),avg=(cv.reduce((a,b)=>a+b,0)/8).toFixed(1);
const names=[...new Set(D.log.flatMap(e=>e.entries.map(x=>x.name)))].sort();if(!names.includes(V.lift))V.lift=names[0];
const ses=[...D.log].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({d:e.date,x:e.entries.find(x=>x.name===V.lift)})).filter(s=>s.x);
let pr=null,be=0,tv=0;const pts=ses.map(s=>{let m=0;s.x.sets.forEach(t=>{if(!pr||t.w>pr.w||(t.w===pr.w&&t.r>pr.r))pr=t;m=Math.max(m,e1(t,s.x.type));tv+=t.w*t.r*(s.x.type==='db'?2:1)});be=Math.max(be,m);return[s.d,m]});
const dbn=ses[0].x.type==='db';
return`<div class=grid><div class=card2><div class=sub>This week</div><div class=big>${cv[7]}</div></div><div class=card2><div class=sub>Avg per week</div><div class=big>${avg}</div></div></div>
<div class=lab>Workouts per week</div>${bars(cv,lb)}<div class=lab>Volume per week (lb)</div>${bars(vv,lb)}
<div class=lab>Lift stats</div><select id=ls onchange="V.lift=this.value;render()" style="width:100%">${names.map(n=>`<option ${n===V.lift?'selected':''}>${esc(n)}</option>`).join('')}</select>
<div class=grid style="margin-top:8px"><div class=card2><div class=sub>PR${dbn?' (each)':''}</div><div class=big>${pr.w}×${pr.r}</div></div><div class=card2><div class=sub>Est. 1RM${dbn?' (both)':''}</div><div class=big>${Math.round(be)}</div></div><div class=card2><div class=sub>Total volume</div><div class=big>${k(tv)}</div></div><div class=card2><div class=sub>Sessions</div><div class=big>${ses.length}</div></div></div>
<div class=lab>Est. 1RM over time</div>${line(pts)}`}

/* SETTINGS + BACKUP */
function sett(){dg(`<h3>Settings</h3><label>Bar weight (lb)<input id=sb type=number value="${D.bar}"></label><label>Plates per side (lb, comma separated)<input id=sp value="${D.plates.join(', ')}"></label>
<button class=fill onclick="ssave()">Save settings</button><div class=lab>Backup</div><div class=row><button class=tonal onclick="expo()">Export</button><button class=tonal onclick="impo()">Import</button></div>
<textarea id=bk placeholder="Export fills this with your data. Paste a backup here to import."></textarea><div id=bm class=sub></div><div class=lab>Sample data</div><div class=row><button class=tonal onclick="demo()">Load samples</button><button class=tonal onclick="wipe()">Clear all</button></div><div class=acts><button class=text onclick=cl()>Close</button></div>`)}
function wipe(){sure('Delete all routines and workouts? Export first if you want a backup.',()=>{D=mig({theme:D.theme,bar:D.bar,plates:D.plates});save();cl();go('train')})}
function demo(){sure('Replace your data with 6 weeks of sample workouts? Export first if you have real data.',()=>{
const P=[['Push',[['Bench Press','plate',135,8,5],['Incline Dumbbell Press','db',40,10,2.5],['Chest Press Machine','machine',100,12,10]]],['Pull',[['Barbell Row','plate',115,8,5],['Lat Pulldown','machine',110,10,5],['Dumbbell Curl','db',25,10,2.5]]],['Legs',[['Squat','plate',185,6,10],['Leg Press','machine',270,10,20],['Leg Curl','machine',80,12,5]]],['Shoulders and Arms',[['Overhead Press','plate',85,8,5],['Lateral Raise','db',15,12,2.5],['EZ Bar Curl','other',65,10,5]]]];
const mk=(l,n)=>[0,1,2].map(j=>({w:l[2]+n*l[4],r:l[3]-(j>1?1:0)+(n%2)}));
D.routines=[{id:'r1',name:'4-day split'}];D.rid='r1';D.days=P.map(([n,ls])=>({id:uid(),rid:'r1',name:n,lifts:ls.map(l=>({id:uid(),name:l[0],type:l[1],sets:mk(l,0)}))}));
D.log=[];const b=dt(wk(today()));
for(let w=0;w<6;w++)P.forEach(([n,ls],i)=>{const t=new Date(b);t.setDate(t.getDate()-35+7*w+[0,1,3,4][i]);if(iso(t)>today())return;D.log.push({id:uid(),date:iso(t),day:n,entries:ls.map(l=>({name:l[0],type:l[1],sets:mk(l,w)}))})});
D.days.forEach(d=>{const e=D.log.filter(x=>x.day===d.name).pop();if(e)d.lifts.forEach(l=>{const m=e.entries.find(x=>x.name===l.name);if(m)l.sets=m.sets})});
D.cur=null;save();cl();go('stats')})}
function ssave(){D.bar=+$('#sb').value||45;const p=$('#sp').value.split(',').map(x=>+x).filter(x=>x>0).sort((a,b)=>b-a);if(p.length)D.plates=p;save();cl();render()}
function expo(){const t=$('#bk');t.value=JSON.stringify({...D,cur:null});t.select();let m='Select all and copy this somewhere safe.';try{navigator.clipboard.writeText(t.value).then(()=>{$('#bm').textContent='Copied. Paste it into a note or file as your backup.'},()=>{})}catch(e){}$('#bm').textContent=m}
function impo(){let d;try{d=JSON.parse($('#bk').value)}catch(e){}if(!d||!Array.isArray(d.days)||!Array.isArray(d.log)){$('#bm').textContent='That is not a valid backup.';return}
sure('Replace all current data with this backup?',()=>{D=mig({...d,cur:null});save();render()})}
render();
</script>
</body>
